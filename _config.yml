# Site identity: the name in the header and footer, and the line under it.
title: Gábor Tóth
bio: What makes us who we are, if not the way we experience the world
# Deliberately empty: every page sets its own description. A page without one then has no meta
# description and fails the build (a post would fall back to its excerpt, which the build also
# rejects). Left out, the GitHub Pages metadata plugin would fill it from the repository's
# description and such pages would quietly use that instead. The feed's subtitle is empty as a result.
description: ""

url: https://f-f-9-9-0-0.github.io
baseurl: ""
# A post's file name is its address.
permalink: /:title/

# The portrait on the About page.
picture: assets/images/profile.jpg

# Link previews: a page without an `image` of its own shares the site card, which
# scripts/site-assets/render.mjs draws from the home page's words. Posts are left out: each sets its
# own, and the build fails on a page or post with none.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/images/social-preview.png

# Profiles linked from the footer; the Projects page also links GitHub.
linkedin: ff9900
github: f-f-9-9-0-0

# Sections of the site: the navigation (_data/navigation.yml names these settings) and the footer
# show only those set to true; the home page checks `projects`.
projects: true
about: true
blog: true

# Under each post: articles on the same topics. The author box always follows.
related: true

plugins:
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  [
    "scripts",
    "docs",
    "ANALYTICS.md",
    "README.md",
    "Gemfile",
    "Gemfile.lock",
    "vendor",
    "utils"
  ]

# Presentation
hero_label: Technical writing
hero_title: Practical notes on data engineering, Apache Airflow and reliable data workflows.
favicon: /assets/images/favicon/favicon.ico
privacy_links:
  - title: Privacy
    url: /privacy/en/privacy.html
    lang: en
  - title: Privacy choices
    url: /privacy/en/choices.html
    lang: en
