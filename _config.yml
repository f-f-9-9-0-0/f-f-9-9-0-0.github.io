# Site identity: the name in the header and footer, the line under it, and the default meta
# description of pages that set none.
title: Gábor Tóth
bio: What makes us who we are, if not the way we experience the world
description: In-depth guides and practical notes on data engineering, with a focus on Apache Airflow and reliable data workflows.

url: https://f-f-9-9-0-0.github.io
baseurl: ""
# A post's file name is its address.
permalink: /:title/

# The portrait on the About page; set external-image when picture is a full URL.
external-image: false
picture: assets/images/profile.jpg

# Profiles linked from the footer.
linkedin: ff9900
github: f-f-9-9-0-0

# Post authors, keyed by the `author` front matter value.
authors:
  gabor:
    name: Gábor Tóth
    bio: What makes us who we are, if not the way we experience the world
    external-image: false
    picture: assets/images/profile.jpg

# Sections in the main navigation (_data/navigation.yml names these settings).
projects: true
about: true
blog: true

# Under each post: articles on the same topics, and the author box.
related: true
show-author: true

# Posts are listed unless they set hidden: true.
defaults:
  - scope:
      path: ""
      layout: "post"
    values:
      hidden: false

plugins:
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-feed
  - jemoji

exclude:
  [
    "scripts",
    "docs",
    "ANALYTICS.md",
    "README.md",
    "Gemfile",
    "Gemfile.lock",
    "vendor",
    "utils"
  ]

# Presentation
hero_label: Technical writing
hero_title: Practical notes on data engineering, Apache Airflow and reliable data workflows.
favicon: /assets/images/favicon/favicon.ico
privacy_links:
  - title: Privacy
    url: /privacy/en/privacy.html
    lang: en
  - title: Privacy choices
    url: /privacy/en/choices.html
    lang: en
