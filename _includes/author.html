{% assign author = site.authors[page.author] %}
{% if author %}
<section class="author" aria-labelledby="author-name">
  {% if author.picture %}<img class="author-photo" src="{% if author.external-image %}{{ author.picture }}{% else %}{{ author.picture | relative_url }}{% endif %}" alt="" width="64" height="64" loading="lazy">{% endif %}
  <div>
    <h2 id="author-name">{{ author.name | escape }}</h2>
    {% if author.bio %}<p class="author-bio">{{ author.bio | escape }}</p>{% endif %}
    <div class="share chips" role="group" aria-label="Share this article">
      <a href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | url_encode }}&amp;text={{ page.title | url_encode }}">Share on Twitter</a>
      <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}">Share on Facebook</a>
    </div>
  </div>
</section>
{% endif %}
