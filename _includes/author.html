<section class="author{% if site.disqus == false %} no-disqus{% endif %}">
    <div class="toleft">
        <img
            class="selfie"
            src="{% if site.authors[page.author].external-image == true %}{{ site.authors[page.author].picture }}{% else %}{{ site.authors[page.author].picture | relative_url }}{% endif %}"
            alt="{{ site.authors[page.author].name }}"
        />
    </div>

    <div class="toright">
        <h2 class="name">{{ site.authors[page.author].name }}</h2>
        <p class="bio">{{ site.authors[page.author].bio }}</p>

        <div class="share" role="group" aria-label="Share this article">
            <a class="twitter" href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | url_encode }}&amp;text={{ page.title | url_encode }}">Share on Twitter</a>
            <a class="facebook" href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | url_encode }}">Share on Facebook</a>
        </div>
    </div>
</section>
