<nav class="nav" aria-label="Main navigation"><ul>
{% for item in site.data.navigation %}
  {% if item.setting == nil or site[item.setting] %}
  <li><a href="{{ item.url | relative_url }}"{% if page.section == item.section or page.layout == 'post' and item.section == 'blog' %} aria-current="{% if page.url == item.url %}page{% else %}true{% endif %}"{% endif %}>{{ item.title | escape }}</a></li>
  {% endif %}
{% endfor %}
</ul></nav>
