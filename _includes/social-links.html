{% if site.linkedin or site.github or site.email %}
<div class="social-links">
{% if site.linkedin %}<a href="https://www.linkedin.com/in/{{ site.linkedin | escape }}">{% include icon.html name='external' %} LinkedIn</a>{% endif %}
{% if site.github %}<a href="https://github.com/{{ site.github | escape }}">{% include icon.html name='code' %} GitHub</a>{% endif %}
{% if site.email %}<a href="mailto:{{ site.email | escape }}">{% include icon.html name='mail' %} Email</a>{% endif %}
</div>
{% endif %}
