<article class="article-row">
  <img class="article-thumb" src="{% if post.image %}{{ post.image | relative_url }}{% else %}{{ '/assets/images/data-network.svg' | relative_url }}{% endif %}" alt="" width="96" height="72" loading="lazy">
  <div class="article-details">
    {% if post.tags.first %}<span class="article-topic">[{{ post.tags.first | escape }}]</span>{% endif %}
    <h{% if page.home %}3{% else %}{{ include.heading | default: 2 }}{% endif %}><a href="{% if post.externalLink %}{{ post.externalLink | escape }}{% else %}{{ post.url | relative_url }}{% endif %}">{{ post.title | escape }}</a></h{% if page.home %}3{% else %}{{ include.heading | default: 2 }}{% endif %}>
    {% unless page.home %}{% if post.description %}<p class="article-summary">{{ post.description | escape }}</p>{% endif %}{% endunless %}
  </div>
  <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%b %-d, %Y' }}</time>
  <span class="row-arrow" aria-hidden="true">→</span>
</article>
