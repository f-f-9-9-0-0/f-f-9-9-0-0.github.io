<article class="item{% if post.star %} star{% endif %}">
    <h{% if include.heading %}{{ include.heading }}{% else %}2{% endif %} class="title"><a href="{% if post.externalLink %}{{ post.externalLink | escape }}{% else %}{{ post.url | relative_url }}{% endif %}">{{ post.title | escape }}</a></h{% if include.heading %}{{ include.heading }}{% else %}2{% endif %}>
    <time class="date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%b %-d, %Y' }}</time>
    {% if post.description %}<p class="summary">{{ post.description | escape }}</p>{% endif %}
</article>
