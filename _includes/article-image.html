<figure class="article-figure">
  <a href="{{ include.src | relative_url }}" aria-label="{{ include.alt | escape }} — open full-size image"><img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy" decoding="async"></a>
  <figcaption>{{ include.caption | default: include.alt | escape }} <span>· Open image for full size</span></figcaption>
</figure>
