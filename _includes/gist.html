<figure class="code-embed">
  <figcaption><span>Code example</span><a href="https://gist.github.com/{{ include.id | escape }}">View source on GitHub <span aria-hidden="true">↗</span></a></figcaption>
  <details>
    <summary><span class="when-closed">Show the code</span><span class="when-open" hidden>Hide the code</span></summary>
    <div class="gist-scroll" tabindex="0" role="region" aria-label="Embedded code example">
      <script src="https://gist.github.com/{{ include.id | escape }}.js"></script>
    </div>
  </details>
  <script>matchMedia('(prefers-color-scheme: dark)').matches || (document.currentScript.previousElementSibling.open = true);</script>
</figure>
