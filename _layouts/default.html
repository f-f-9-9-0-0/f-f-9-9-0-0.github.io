<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% for alternate in page.alternates %}<link rel="alternate" hreflang="{{ alternate[0] | escape }}" href="{{ alternate[1] | absolute_url | escape }}">{% endfor %}
  {% if page.robots %}<meta name="robots" content="{{ page.robots | escape }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
  {% if site.favicon %}<link rel="icon" href="{{ site.favicon | relative_url }}">{% endif %}
</head>
<body>
  <a class="skip-link" lang="en" href="#main-content">Skip to content</a>
  <div class="site-frame">
    {% include header.html %}
    <main id="main-content" tabindex="-1" class="{% if page.layout == 'post' %}post{% elsif page.home %}home{% else %}page{% endif %} {{ page.section | escape }}">{{ content }}</main>
    {% include footer.html %}
  </div>
  {% include analytics.html %}
</body>
</html>
